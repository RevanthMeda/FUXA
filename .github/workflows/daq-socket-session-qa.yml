name: DAQ real Socket.IO session QA

on:
  push:
    branches: [qa/daq-socket-session-isolation]

permissions:
  contents: read

jobs:
  regression:
    name: Socket sessions and backend (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Real Socket.IO sessions
        run: npx mocha test/integration/daqSocketSessions.test.js --timeout 10000
      - name: Full backend regression
        run: npm test
