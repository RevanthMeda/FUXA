name: Node-RED alarm history QA

on:
  push:
    branches: [qa/node-red-alarm-history-timestamps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: UTC alarm history, DAQ and permission regressions
        env:
          TZ: UTC
        run: npx mocha test/authorization/nodeRedAlarmHistoryTimestamps.test.js test/authorization/nodeRedDaqTimestamps.test.js test/alarms/*.test.js
      - name: New York timestamp contracts
        env:
          TZ: America/New_York
        run: npx mocha test/authorization/nodeRedAlarmHistoryTimestamps.test.js test/authorization/nodeRedDaqTimestamps.test.js
      - name: Complete backend suite
        run: npm test
