name: Node-RED tag change QA

on:
  push:
    branches: [qa/node-red-tag-change-values]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Tag value, runtime helper, DAQ and OPC UA regressions
        run: npx mocha test/authorization/nodeRedTagChangeValues.test.js test/authorization/nodeRedRuntimeHelpers.test.js test/authorization/nodeRedDaqTimestamps.test.js test/devices/opcuaArrays.test.js
      - name: Complete backend suite
        run: npm test
