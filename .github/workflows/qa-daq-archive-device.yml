name: DAQ archive device identity QA
on:
  push:
    branches: [qa/daq-archive-device-20261027]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: 9bbd8c973d2e1d467ef32142e93d02f17218ab4e
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Verify exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = 9bbd8c973d2e1d467ef32142e93d02f17218ab4e
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: DAQ archive cleanup regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/storage/daqArchiveDevice.test.js
      - name: Full backend suite
        run: npm test -- --reporter dot
