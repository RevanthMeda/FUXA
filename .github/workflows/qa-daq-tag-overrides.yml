name: Node-RED DAQ tag override QA
on:
  push:
    branches: [qa/daq-tag-overrides-20261020]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: cbbacb145110eb6ee3ef518a0c671f34a7785000
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Record exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = cbbacb145110eb6ee3ef518a0c671f34a7785000
          git rev-parse HEAD
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Focused DAQ and Node-RED regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/authorization/nodeRedDaqTagOverrides.test.js test/authorization/nodeRedRuntimeHelpers.test.js test/authorization/nodeRedSecurity.test.js test/authorization/nodeRedDaqTimestamps.test.js
      - name: Reject the original DAQ tag selectors
        run: node ../../server/qa/daq-tag-override-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
