name: Device lookup override QA
on:
  push:
    branches: [qa/get-device-overrides-20261018]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        variant: [standalone, with-pending-prs]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: ${{ matrix.variant == 'standalone' && 'f30d3d9e4d8867f3ceaf8484b137caf6519a46d9' || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Focused node and runtime helper regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/authorization/nodeRedEnableDeviceOverrides.test.js test/authorization/nodeRedDevicePropertyOverrides.test.js test/authorization/nodeRedGetDeviceOverrides.test.js test/authorization/nodeRedRuntimeHelpers.test.js test/authorization/nodeRedDevicePropertySecurity.test.js
      - name: Reject original override precedence
        run: |
          node ../../server/qa/enable-device-override-negative.cjs
          node ../../server/qa/device-property-override-negative.cjs get
          node ../../server/qa/device-property-override-negative.cjs set
          node ../../server/qa/get-device-override-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
