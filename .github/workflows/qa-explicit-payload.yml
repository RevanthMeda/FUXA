name: Explicit EtherNet-IP payload contract QA
on:
  push:
    branches: [qa/explicit-payload-contract-20261020]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: fd776082e256fcc13726bcdce589eb9161efb307
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Record exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = fd776082e256fcc13726bcdce589eb9161efb307
          git rev-parse HEAD
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Focused driver regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/devices/genericEthernetIp.test.js
      - name: Reject blind payload flattening
        run: node ../../server/qa/explicit-payload-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
