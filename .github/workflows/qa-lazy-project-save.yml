name: Lazy project save QA
on:
  push:
    branches: [qa/lazy-project-save-20261028]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: 809cda0c60ded92479fdb20e754bac12e668a814
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Verify exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = 809cda0c60ded92479fdb20e754bac12e668a814
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Lazy project save regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/api/projectLazySave.test.js test/api/projectLazyLoading.test.js
      - name: Full backend suite
        run: npm test -- --reporter dot
