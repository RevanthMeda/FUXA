name: Current-master elapsed-time regression QA
on:
  push:
    branches: [qa/runtime-clock-current-master-20261020]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: 41c0369466d5b9817a3e5dcd9435b641efd633d4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Record exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = 41c0369466d5b9817a3e5dcd9435b641efd633d4
          git rev-parse HEAD
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Focused elapsed-time regression
        run: ./node_modules/.bin/mocha --timeout 10000 test/help/runtimeUtils.test.js --grep 'Utils.endTime'
      - name: Reject wrong elapsed value and verify Date restoration
        run: node ../../server/qa/runtime-clock-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
