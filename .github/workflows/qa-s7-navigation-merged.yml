name: Merged S7 and navigation QA
on:
  push:
    branches: [qa/s7-navigation-merged-20261028]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: 40ff05d000d6ce1d6e7f6492bbb372a6f7138f2e
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Verify exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = 40ff05d000d6ce1d6e7f6492bbb372a6f7138f2e
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: S7 and navigation regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/devices/s7ConnectionSettings.test.js test/devices/s7ReadRecovery.test.js test/devices/s7Write.test.js test/devices/deviceLifecycle.test.js test/authorization/nodeRedNavigationOverrides.test.js
      - name: Verify settings regression sensitivity
        run: node ../../server/qa/s7-settings-negative.cjs
      - name: Verify read recovery regression sensitivity
        run: node ../../server/qa/s7-read-recovery-negative.cjs
      - name: Verify navigation regression sensitivity
        run: node ../../server/qa/navigation-overrides-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
