name: Node-RED tag change payload QA
on:
  push:
    branches: [qa/tag-change-payload-20261025]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: ac14da657ef4ac45536ad766a81362bd6fc07cda
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: source/server/package-lock.json
      - name: Record exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = ac14da657ef4ac45536ad766a81362bd6fc07cda
          git rev-parse HEAD
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - name: Tag change regressions
        run: ./node_modules/.bin/mocha --timeout 10000 test/authorization/nodeRedTagChangeValues.test.js
      - name: Reject original payload alias
        run: node ../../server/qa/tag-change-payload-negative.cjs
      - name: Full backend suite
        run: npm test -- --reporter dot
