name: Script calendar stop QA
on:
  push:
    branches:
      - qa/script-calendar-stop-20261030
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: source/server
    steps:
      - name: Check out QA definition
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check out exact contribution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d1f67dd5799dc5dfe2d90bc51c8896feb064e36d
          fetch-depth: 2
          path: source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime versions
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Script calendar stop regressions
        run: npx mocha --timeout 10000 test/runtime/scriptCalendarStop.test.js
      - name: Verify tests reject the original runtime
        run: node ../../qa-script-calendar-negative.cjs
      - name: Complete backend suite
        run: npm test
